# Render Blueprint for the API (free plan). Render builds backend/Dockerfile.
# Values marked "sync: false" are secrets: Render asks for them in the dashboard, they are never in git.
services:
  - type: web
    name: skca-enrol-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT                     # tells Render which port the container listens on
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false                   # Neon connection string (Npgsql format, SSL Mode=Require)
      - key: Jwt__Key
        generateValue: true           # Render creates a random secret once
      - key: Llm__Provider
        value: Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false                   # the Vercel URL of the web app, e.g. https://skca-enrol.vercel.app
      - key: Seed__Enabled
        value: "true"                 # demo accounts for markers (only seeds an empty database)
      - key: Seed__DemoPassword
        sync: false
